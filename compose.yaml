name: university-management-system

services:
  db:
    image: mysql:8.0
    container_name: university_db
    environment:
      MYSQL_DATABASE: university_db
      MYSQL_USER: university_user
      MYSQL_PASSWORD: university_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # Docker runs this command every 10s. The app starts only when it succeeds ("healthy").
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: university_app
    depends_on:
      db:
        condition: service_healthy   # wait until MySQL is healthy
    ports:
      - "${APP_PORT:-8080}:8080"   # change with APP_PORT=8082 if port 8080 is busy
    environment:
      # overrides spring.datasource.* from application.properties ("db" = name of the service above)
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/university_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: university_user
      SPRING_DATASOURCE_PASSWORD: university_pass
    # safety net: MySQL can restart once while it initialises on the very first start
    restart: on-failure

  # Browser-based database interface for development and demonstrations.
  adminer:
    image: adminer:4
    container_name: university_adminer
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    restart: on-failure

volumes:
  mysql_data:
