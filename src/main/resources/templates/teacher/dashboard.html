<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Teacher Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <h2 class="mb-4">Welcome, <span th:text="${teacher.fullName}">Teacher</span></h2>

    <div class="row g-3">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">My Profile</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item"><strong>Name:</strong> <span th:text="${teacher.fullName}"></span></li>
                    <li class="list-group-item"><strong>Email:</strong> <span th:text="${teacher.email}"></span></li>
                    <li class="list-group-item"><strong>Department:</strong> <span th:text="${teacher.department}"></span></li>
                    <li class="list-group-item"><strong>Designation:</strong> <span th:text="${teacher.designation}"></span></li>
                </ul>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Quick Links</div>
                <div class="list-group list-group-flush">
                    <a class="list-group-item list-group-item-action" th:href="@{/teacher/teachers}">View Teachers</a>
                    <a class="list-group-item list-group-item-action" th:href="@{/teacher/students}">View Students</a>
                    <a class="list-group-item list-group-item-action" th:href="@{/teacher/students/new}">Register a New Student</a>
                    <a class="list-group-item list-group-item-action" th:href="@{/teacher/teachers/{id}/edit(id=${teacher.id})}">Edit My Profile</a>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
