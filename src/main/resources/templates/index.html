<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Home')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-5 text-center">
    <h1 class="display-5">University Management System</h1>
    <p class="lead text-muted">Manage admins, teachers and students in one place.</p>

    <div sec:authorize="!isAuthenticated()">
        <a class="btn btn-primary btn-lg" th:href="@{/login}">Login</a>
    </div>

    <div sec:authorize="hasRole('ADMIN')">
        <a class="btn btn-primary btn-lg" th:href="@{/admin/dashboard}">Go to Admin Dashboard</a>
    </div>
    <div sec:authorize="hasRole('TEACHER')">
        <a class="btn btn-primary btn-lg" th:href="@{/teacher/dashboard}">Go to Teacher Dashboard</a>
    </div>
    <div sec:authorize="hasRole('STUDENT')">
        <a class="btn btn-primary btn-lg" th:href="@{/student/dashboard}">Go to Student Dashboard</a>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
