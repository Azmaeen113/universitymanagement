<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Common <head>: Bootstrap 5 from CDN + our own css -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | University Management'">University Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Navbar: the links depend on the role of the logged in user -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">University Management</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto" sec:authorize="isAuthenticated()">
                <th:block sec:authorize="hasRole('ADMIN')">
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/admins}">Admins</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/teachers}">Teachers</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/students}">Students</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/students/pending}">Pending</a></li>
                </th:block>
                <th:block sec:authorize="hasRole('TEACHER')">
                    <li class="nav-item"><a class="nav-link" th:href="@{/teacher/dashboard}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/teacher/teachers}">Teachers</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/teacher/students}">Students</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/teacher/students/new}">Register Student</a></li>
                </th:block>
                <th:block sec:authorize="hasRole('STUDENT')">
                    <li class="nav-item"><a class="nav-link" th:href="@{/student/dashboard}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/student/students}">Students</a></li>
                </th:block>
            </ul>
            <div class="ms-auto d-flex align-items-center text-white" sec:authorize="isAuthenticated()">
                <span class="me-3 small" sec:authentication="name">user</span>
                <!-- logout must be a POST form because CSRF protection is on -->
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            </div>
            <div class="ms-auto" sec:authorize="!isAuthenticated()">
                <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Login</a>
            </div>
        </div>
    </div>
</nav>

<!-- Green / red messages. "success" and "error" come from RedirectAttributes.addFlashAttribute -->
<div th:fragment="alerts">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</div>

<!-- Bootstrap javascript (needed for the mobile menu button) -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
