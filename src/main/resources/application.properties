spring.application.name=university-management
server.port=8080

# ---- Database (MySQL) ----
# These are the defaults for running on your own computer.
# In Docker, compose.yaml replaces them with environment variables
# (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
spring.datasource.url=jdbc:mysql://localhost:3306/university_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=university_user
spring.datasource.password=university_pass

# ---- JPA / Hibernate ----
# "update" creates / changes the tables automatically from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
